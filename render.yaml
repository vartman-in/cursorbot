services:
  - type: web
    name: cursorbot-whatsapp
    env: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: OPENAI_API_KEY
        sync: false
      - key: INSTANCE_ID
        sync: false
      - key: INSTANCE_TOKEN
        sync: false
      - key: GREEN_API_HOST
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
