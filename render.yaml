services:
  - type: web
    name: cursorbot-whatsapp
    env: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: INSTANCE_ID
        sync: false
      - key: INSTANCE_TOKEN
        sync: false
      - key: GREEN_API_HOST
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: FIREBASE_CREDENTIALS
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: STAFF_USERS_JSON
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: RENDER_EXTERNAL_URL
        sync: false
      - key: GOOGLE_REVIEW_URL
        sync: false
